<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>Acceso — Argos OSINT</title>
<link rel="icon" href="assets/argos-osint_favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/common.css">
<style>
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px;width:100%;max-width:420px}
  .logo{text-align:center;margin-bottom:8px}
  .logo img{height:48px;margin-bottom:8px}
  .logo h1{font-size:20px;font-weight:700;margin:0}
  .logo h1 span{color:var(--accent2)}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px}
  .tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.2s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent2);border-bottom-color:var(--accent2)}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:4px;font-weight:600}
  .field input{width:100%;padding:10px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;transition:border-color 0.2s}
  .field input:focus{border-color:var(--accent)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;margin-bottom:8px}
  .btn-ghost{background:transparent;color:var(--muted);border:none;padding:8px;font-size:12px}.btn-ghost:hover{color:var(--text)}
  .divider{text-align:center;color:var(--muted);font-size:12px;margin:16px 0;position:relative}
  .divider::before,.divider::after{content:"";position:absolute;top:50%;width:calc(50% - 20px);height:1px;background:var(--border)}
  .divider::before{left:0}.divider::after{right:0}
  .msg{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none;text-align:center}
  .msg.error{display:block;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
  .msg.success{display:block;background:rgba(110,231,183,0.1);border:1px solid rgba(110,231,183,0.3);color:#6ee7b7}
  .msg.info{display:block;background:rgba(79,140,255,0.1);border:1px solid rgba(79,140,255,0.3);color:#93bbfd}
  .msg.warn{display:block;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:#fbbf24}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5}
  .login-spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block}
  .pending-box{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:16px;text-align:center;margin-top:12px}
  .pending-box h3{color:var(--warn);font-size:14px;margin-bottom:6px}
  .pending-box p{font-size:12px;color:var(--muted);line-height:1.5}
  .footer-links{text-align:center;margin-top:16px;font-size:11px;color:var(--muted)}
  .footer-links a{color:var(--accent);text-decoration:none}.footer-links a:hover{color:var(--accent2)}
  @media(max-width:480px){.login-card{padding:24px 16px;border-radius:0;border-left:none;border-right:none}}
</style>
</head>
<body>
<div class="argos-bg" aria-hidden="true"><canvas></canvas></div>
<div class="center">
  <div class="login-card">
    <div class="logo">
      <img src="assets/argos-osint_isotipo_mono-blanco.svg" alt="Argos OSINT">
      <h1>ARGOS <span>OSINT</span></h1>
    </div>
    <div class="subtitle">Plataforma de inteligencia de fuentes abiertas</div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Iniciar sesión</button>
      <button class="tab" data-tab="register">Crear cuenta</button>
    </div>

    <!-- LOGIN TAB -->
    <div class="tab-panel active" id="panel-login">
      <div class="field">
        <label for="login-user">Usuario o correo</label>
        <input type="text" id="login-user" placeholder="tu@email.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div id="login-msg" class="msg"></div>
      <button class="btn btn-primary" id="btn-login">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Iniciar sesión
      </button>
      <div class="divider">o</div>
      <button class="btn btn-secondary" id="btn-passkey">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        Entrar con llave de acceso (Passkey)
      </button>
    </div>

    <!-- REGISTER TAB -->
    <div class="tab-panel" id="panel-register">
      <div class="field">
        <label for="reg-name">Nombre completo</label>
        <input type="text" id="reg-name" placeholder="Juan Pérez García" autocomplete="name">
      </div>
      <div class="field">
        <label for="reg-email">Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="juan@empresa.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="reg-user">Nombre de usuario</label>
        <input type="text" id="reg-user" placeholder="juanperez" autocomplete="username">
      </div>
      <div class="field">
        <label for="reg-pass">Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="reg-pass2">Confirmar contraseña</label>
        <input type="password" id="reg-pass2" placeholder="Repite la contraseña" autocomplete="new-password">
      </div>
      <div id="reg-msg" class="msg"></div>
      <button class="btn btn-primary" id="btn-register">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Crear cuenta
      </button>
      <div id="reg-pending" class="pending-box" style="display:none">
        <h3>⏳ Cuenta creada — Pendiente de aprobación</h3>
        <p>Tu cuenta ha sido creada exitosamente. Un administrador debe aprobarla antes de que puedas acceder. Recibirás un correo cuando sea aprobada.</p>
      </div>
    </div>

    <div class="footer-links">
      <a href="/terms.html">Términos</a> · <a href="/privacy.html">Privacidad</a> · <a href="/contact.html">Contacto</a>
    </div>
  </div>
</div>

<script>
const API_URL = location.origin;

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
  });
});

function setMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

// LOGIN
document.getElementById('btn-login').addEventListener('click', async () => {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value;
  if (!username || !password) { setMsg('login-msg', 'Ingresa usuario y contraseña.', 'error'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Validando...';
  setMsg('login-msg', '', '');

  try {
    const r = await fetch(API_URL + '/api/auth/login/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const res = await r.json();
    if (res.error) throw new Error(res.error);
    if (res.token) localStorage.setItem('session_token', res.token);
    setMsg('login-msg', 'Acceso concedido. Redirigiendo...', 'success');
    await redirectAfterLogin();
  } catch (e) {
    setMsg('login-msg', e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Iniciar sesión';
  }
});

// Enter key on password field
document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});

// PASSKEY LOGIN
document.getElementById('btn-passkey').addEventListener('click', async () => {
  if (!window.PublicKeyCredential) {
    setMsg('login-msg', 'Tu navegador no soporta passkeys. Usa contraseña.', 'error');
    return;
  }
  const username = document.getElementById('login-user').value.trim();
  if (!username) { setMsg('login-msg', 'Ingresa tu usuario primero.', 'error'); return; }

  const btn = document.getElementById('btn-passkey');
  btn.disabled = true;
  setMsg('login-msg', '', '');

  try {
    const r1 = await fetch(API_URL + '/api/auth/login/options', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const options = await r1.json();
    if (options.error) throw new Error(options.error);

    const credential = await navigator.credentials.get({ publicKey: options });
    const payload = {
      id: credential.id,
      rawId: Array.from(new Uint8Array(credential.rawId)),
      type: credential.type,
      response: {
        authenticatorData: Array.from(new Uint8Array(credential.response.authenticatorData)),
        clientDataJSON: Array.from(new Uint8Array(credential.response.clientDataJSON)),
        signature: Array.from(new Uint8Array(credential.response.signature)),
      }
    };

    const r2 = await fetch(API_URL + '/api/auth/login/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: payload })
    });
    const res = await r2.json();
    if (res.error) throw new Error(res.error);
    if (res.token) localStorage.setItem('session_token', res.token);
    setMsg('login-msg', 'Acceso concedido. Redirigiendo...', 'success');
    await redirectAfterLogin();
  } catch (e) {
    setMsg('login-msg', 'Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// REGISTER
document.getElementById('btn-register').addEventListener('click', async () => {
  const nombre = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const username = document.getElementById('reg-user').value.trim();
  const password = document.getElementById('reg-pass').value;
  const password2 = document.getElementById('reg-pass2').value;

  if (!nombre || !email || !username || !password) {
    setMsg('reg-msg', 'Todos los campos son obligatorios.', 'error'); return;
  }
  if (password.length < 8) {
    setMsg('reg-msg', 'La contraseña debe tener al menos 8 caracteres.', 'error'); return;
  }
  if (password !== password2) {
    setMsg('reg-msg', 'Las contraseñas no coinciden.', 'error'); return;
  }
  if (!email.includes('@')) {
    setMsg('reg-msg', 'Ingresa un correo válido.', 'error'); return;
  }

  const btn = document.getElementById('btn-register');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creando cuenta...';
  setMsg('reg-msg', '', '');

  try {
    const r = await fetch(API_URL + '/api/auth/register/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, nombre, email })
    });
    const res = await r.json();
    if (res.error) throw new Error(res.error);

    // Show pending approval message
    document.getElementById('reg-pending').style.display = 'block';
    btn.style.display = 'none';
    setMsg('reg-msg', 'Cuenta creada exitosamente.', 'success');
  } catch (e) {
    setMsg('reg-msg', e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Crear cuenta';
  }
});

// Enter key on register fields
document.getElementById('reg-pass2').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-register').click();
});

// Redirect after login
async function redirectAfterLogin() {
  const next = new URLSearchParams(location.search).get('next');
  if (next) { location.href = next; return; }
  try {
    const r = await fetch(API_URL + '/api/subscribe/status', {
      headers: { 'Authorization': 'Bearer ' + localStorage.getItem('session_token') }
    });
    const sub = await r.json();
    location.href = sub.has_subscription ? '/dashboard.html' : '/subscribe.html';
  } catch(e) { location.href = '/subscribe.html'; }
}

// Auto-login check
(async () => {
  const token = localStorage.getItem('session_token');
  if (!token) return;
  try {
    const r = await fetch(API_URL + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (r.ok) await redirectAfterLogin();
  } catch(e) {}
})();
</script>
<script src="js/common.js"></script>
</body>
</html>
