<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Acceso — Cuarto de Paz Search</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #1a1d24;
  --panel2: #232730;
  --border: #2c313c;
  --text: #e6e8ec;
  --muted: #8a93a6;
  --accent: #4f8cff;
  --accent2: #6ee7b7;
  --warn: #f59e0b;
  --error: #ef4444;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  min-height: 100vh;
}
.center {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
.logo {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
  text-align: center;
}
.subtitle {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  margin-bottom: 24px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}
.field input {
  width: 100%;
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 15px;
  min-height: 48px;
}
.field input:focus { outline: none; border-color: var(--accent); }
.btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  min-height: 48px;
  min-width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}
.btn:hover { filter: brightness(1.1); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
}
@media (max-width: 480px) {
  .login-card { padding: 22px 18px; border-radius: 0; border-left: none; border-right: none; }
  .center { padding: 0; }
  .logo { font-size: 18px; }
  .field input { font-size: 16px; }
  .btn { font-size: 16px; padding: 16px; }
}

/* ==== Premium buttons (glass-morphism) — 2026-08-04 ==== */
button, .btn, input[type="submit"] {
  font-family: inherit;
  letter-spacing: 0.2px;
  transition: transform 0.12s ease, box-shadow 0.18s ease,
              background 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
  will-change: transform;
}
button:not(:disabled):hover, .btn:not(:disabled):hover {
  transform: translateY(-1px);
}
button:not(:disabled):active, .btn:not(:disabled):active {
  transform: translateY(0);
}
/* Primary: gradient azul + glass + shadow */
.btn:not(.secondary):not(.btn-secondary):not(.btn-warn):not(.btn-danger),
button.primary, button:not([class]),
.btn-primary,
button[id="btn-login"] {
  background: linear-gradient(180deg, rgba(79,140,255,0.95) 0%, rgba(59,120,235,0.95) 100%) !important;
  border: 1px solid rgba(120,170,255,0.45) !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.18) inset,
    0 4px 14px -4px rgba(79,140,255,0.55),
    0 0 0 1px rgba(79,140,255,0.0) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff !important;
  font-weight: 600;
}
.btn:not(.secondary):not(.btn-secondary):not(.btn-warn):not(.btn-danger):hover,
button.primary:hover, button:not([class]):hover,
button[id="btn-login"]:hover {
  background: linear-gradient(180deg, rgba(99,160,255,1) 0%, rgba(79,140,255,1) 100%) !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.25) inset,
    0 6px 20px -4px rgba(79,140,255,0.7),
    0 0 0 1px rgba(120,170,255,0.3) !important;
  filter: none !important;
}
.btn:not(.secondary):not(.btn-secondary):not(.btn-warn):not(.btn-danger):focus-visible,
button.primary:focus-visible, button[id="btn-login"]:focus-visible {
  outline: none !important;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.18) inset,
    0 4px 14px -4px rgba(79,140,255,0.55),
    0 0 0 3px rgba(120,170,255,0.35) !important;
}
/* Secondary: glass oscuro + border translúcido */
.btn.secondary, .btn-secondary, button.secondary {
  background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%) !important;
  border: 1px solid rgba(255,255,255,0.10) !important;
  color: var(--text) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px -2px rgba(0,0,0,0.3) !important;
}
.btn.secondary:hover, .btn-secondary:hover, button.secondary:hover {
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.04) 100%) !important;
  border-color: rgba(120,170,255,0.4) !important;
  color: var(--accent) !important;
  box-shadow: 0 4px 12px -2px rgba(79,140,255,0.25) !important;
}

/* ==== Scrollbars estilizadas — Chrome / Edge / Safari ==== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(120,130,150,0.25);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
  transition: background 0.18s ease;
}
::-webkit-scrollbar-thumb:hover { background: rgba(120,130,150,0.45); background-clip: padding-box; }
::-webkit-scrollbar-thumb:active { background: rgba(120,170,255,0.55); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
/* Firefox + estándar */
html { scrollbar-width: thin; scrollbar-color: rgba(120,130,150,0.35) transparent; }
aside, main, .modal, [style*="overflow"] { scrollbar-width: thin; scrollbar-color: rgba(120,130,150,0.35) transparent; }

.divider {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 18px 0;
  position: relative;
}
.divider::before, .divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 30px);
  height: 1px;
  background: var(--border);
}
.divider::before { left: 0; }
.divider::after { right: 0; }
.msg {
  padding: 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-top: 14px;
  display: none;
}
.msg.error { background: rgba(239,68,68,0.1); border: 1px solid var(--error); color: var(--error); display: block; }
.msg.info { background: rgba(79,140,255,0.1); border: 1px solid var(--accent); color: var(--accent); display: block; }
.msg.ok { background: rgba(110,231,183,0.1); border: 1px solid var(--accent2); color: var(--accent2); display: block; }
.hint {
  font-size: 12px;
  color: var(--muted);
  margin-top: 14px;
  line-height: 1.5;
  text-align: center;
}
.hint code {
  background: var(--panel2);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--accent2);
  font-family: monospace;
}
</style>
</head>
<body>
<div class="center">
  <div class="login-card">
    <div class="logo">🔒 Cuarto de Paz Search</div>
    <div class="subtitle">Accede con tu llave de acceso (passkey)</div>

    <div class="field">
      <label for="username">Usuario / correo</label>
      <input type="text" id="username" placeholder="tu@email.com" autocomplete="username webauthn">
    </div>

    <button class="btn" id="btn-login" onclick="login()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
      Entrar con llave de acceso
    </button>

    <div class="divider">o</div>

    <button class="btn secondary" id="btn-register" onclick="register()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Crear llave de acceso
    </button>

    <div class="divider">o entra con contraseña</div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn secondary" id="btn-pass" onclick="loginPassword()">
      Entrar con contraseña
    </button>

    <div id="msg" class="msg"></div>
    <p class="hint">
      En Android usarás tu cuenta Google. En iPhone/Mac se usará iCloud Keychain / Face ID / Touch ID.
      <br>En escritorio Linux o navegadores sin autenticador, usa "Entrar con contraseña".
    </p>
  </div>
</div>

<script>
const API_URL = (() => {
  const h = location.hostname;
  if (h.endsWith(".trycloudflare.com") || h.endsWith(".pages.dev") ||
      h.endsWith(".workers.dev") || h === "cuartodepazsearch.com" ||
      h.endsWith(".cuartodepazsearch.com") ||
      h.endsWith(".cuartodepaz.org")) {
    return `${location.protocol}//${location.host}`;
  }
  return "http://localhost:8765";
})();
const $ = id => document.getElementById(id);

function setMsg(text, kind) {
  const m = $("msg");
  m.textContent = text;
  m.className = "msg " + (kind || "");
}
function b64ToBuf(b64) {
  const bin = atob(b64.replace(/-/g, "+").replace(/_/g, "/"));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
function bufToB64(buf) {
  const arr = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function register() {
  if (!window.PublicKeyCredential) {
    setMsg("Tu navegador no soporta passkeys. Usa Chrome, Safari, Edge reciente en HTTPS.", "error");
    return;
  }
  const username = $("username").value.trim();
  if (!username) {
    setMsg("Ingresa un usuario o correo.", "error");
    return;
  }
  try {
    $("btn-register").disabled = true;
    setMsg("Preparando registro...", "info");
    const r = await fetch(`${API_URL}/api/auth/register/options`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username}),
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const opts = data.options;
    opts.challenge = b64ToBuf(opts.challenge);
    opts.user.id = b64ToBuf(opts.user.id);
    const cred = await navigator.credentials.create({publicKey: opts});
    const payload = {
      id: cred.id,
      rawId: bufToB64(cred.rawId),
      response: {
        clientDataJSON: bufToB64(cred.response.clientDataJSON),
        attestationObject: bufToB64(cred.response.attestationObject),
      },
      type: cred.type,
      clientExtensionResults: cred.getClientExtensionResults(),
    };
    if (cred.response.transports) payload.response.transports = cred.response.transports;
    const r2 = await fetch(`${API_URL}/api/auth/register/verify`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, credential: payload}),
    });
    const res = await r2.json();
    if (res.error) throw new Error(res.error);
    if (res.token) localStorage.setItem("session_token", res.token);
    setMsg("Llave registrada. Redirigiendo...", "ok");
    location.href = "/";
  } catch (e) {
    setMsg("Error: " + e.message, "error");
    $("btn-register").disabled = false;
  }
}

async function login() {
  if (!window.PublicKeyCredential) {
    setMsg("Tu navegador no soporta passkeys. Usa Chrome, Safari, Edge reciente en HTTPS o entra con contraseña.", "error");
    return;
  }
  const username = $("username").value.trim() || undefined;
  try {
    $("btn-login").disabled = true;
    setMsg("Solicitando llave de acceso...", "info");
    const body = username ? JSON.stringify({username}) : JSON.stringify({});
    const r = await fetch(`${API_URL}/api/auth/login/options`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body,
    });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const opts = data.options;
    opts.challenge = b64ToBuf(opts.challenge);
    if (opts.allowCredentials) {
      opts.allowCredentials = opts.allowCredentials.map(c => ({...c, id: b64ToBuf(c.id)}));
    }
    const cred = await navigator.credentials.get({publicKey: opts});
    const payload = {
      id: cred.id,
      rawId: bufToB64(cred.rawId),
      response: {
        clientDataJSON: bufToB64(cred.response.clientDataJSON),
        authenticatorData: bufToB64(cred.response.authenticatorData),
        signature: bufToB64(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64(cred.response.userHandle) : null,
      },
      type: cred.type,
      clientExtensionResults: cred.getClientExtensionResults(),
    };
    const r2 = await fetch(`${API_URL}/api/auth/login/verify`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({credential: payload}),
    });
    const res = await r2.json();
    if (res.error) throw new Error(res.error);
    if (res.token) localStorage.setItem("session_token", res.token);
    setMsg("Acceso concedido. Redirigiendo...", "ok");
    location.href = "/";
  } catch (e) {
    setMsg("Error: " + e.message, "error");
    $("btn-login").disabled = false;
  }
}

async function loginPassword() {
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) {
    setMsg("Ingresa usuario y contraseña.", "error");
    return;
  }
  try {
    $("btn-pass").disabled = true;
    setMsg("Validando...", "info");
    const r = await fetch(`${API_URL}/api/auth/login/password`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username, password}),
    });
    const res = await r.json();
    if (res.error) throw new Error(res.error);
    if (res.token) localStorage.setItem("session_token", res.token);
    setMsg("Acceso concedido. Redirigiendo...", "ok");
    location.href = "/";
  } catch (e) {
    setMsg("Error: " + e.message, "error");
    $("btn-pass").disabled = false;
  }
}

async function logout() {
  await fetch(`${API_URL}/api/auth/logout`, {method: "POST"});
  localStorage.removeItem("session_token");
  location.href = "/login.html";
}
</script>
</body>
</html>
