<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta Única — Actas</title>
<style>
  :root { --bg: #0f172a; --bg2: #1e293b; --bg3: #334155; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b; --accent: #818cf8; --green: #10b981; --red: #ef4444; --amber: #f59e0b; --border: #334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { width: 100%; max-width: 500px; padding: 32px; }
  h1 { font-size: 1.5em; color: var(--accent); text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: var(--text3); font-size: 0.85em; margin-bottom: 32px; }
  .curp-display { text-align: center; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  .curp-display .label { font-size: 0.75em; color: var(--text3); text-transform: uppercase; }
  .curp-display .value { font-size: 1.1em; font-family: monospace; color: var(--green); margin-top: 4px; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); cursor: pointer; transition: all 0.2s; font-size: 0.95em; }
  .btn:hover { border-color: var(--accent); background: var(--bg3); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn .icon { font-size: 1.3em; }
  .btn .info { text-align: left; flex: 1; }
  .btn .info .title { font-weight: 600; }
  .btn .info .desc { font-size: 0.8em; color: var(--text3); margin-top: 2px; }
  .btn .status { font-size: 0.75em; padding: 4px 10px; border-radius: 12px; font-weight: 600; }
  .btn .status.pending { background: #78350f; color: #fcd34d; }
  .btn .status.ok { background: #065f46; color: #6ee7b7; }
  .btn .status.error { background: #7f1d1d; color: #fca5a5; }
  .btn .status.loading { background: #1e3a5f; color: #93c5fd; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .log { margin-top: 24px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; max-height: 200px; overflow-y: auto; font-size: 0.8em; }
  .log .entry { padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--text2); }
  .log .entry:last-child { border-bottom: none; }
  .log .time { color: var(--text3); margin-right: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
  <h1>Consulta Única</h1>
  <div class="subtitle">Solicitud de actas de registro civil</div>

  <div class="curp-display">
    <div class="label">CURP</div>
    <div class="value">JIGG870223MJCMDB08</div>
  </div>

  <div class="btn-group">
    <button class="btn" id="btn-nacimiento" onclick="solicitar('nacimiento')">
      <span class="icon">👶</span>
      <div class="info">
        <div class="title">Acta de Nacimiento</div>
        <div class="desc">Costo: 4 créditos (se revierten si no existe)</div>
      </div>
      <span class="status" id="status-nacimiento">Solicitar</span>
    </button>

    <button class="btn" id="btn-matrimonio" onclick="solicitar('matrimonio')">
      <span class="icon">💒</span>
      <div class="info">
        <div class="title">Acta de Matrimonio</div>
        <div class="desc">Costo: 4 créditos (se revierten si no existe)</div>
      </div>
      <span class="status" id="status-matrimonio">Solicitar</span>
    </button>

    <button class="btn hidden" id="btn-divorcio" onclick="solicitar('divorcio')" disabled>
      <span class="icon">📋</span>
      <div class="info">
        <div class="title">Acta de Divorcio</div>
        <div class="desc">Solo disponible si existe acta de matrimonio</div>
      </div>
      <span class="status" id="status-divorcio">Bloqueado</span>
    </button>
  </div>

  <div class="log" id="log">
    <div class="entry"><span class="time">--:--</span>Listo para solicitar</div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8765';
const CURP = 'JIGG870223MJCMDB08';
const JOBS = {};

async function getToken() {
  const r = await fetch(`${API}/api/auth/login/password`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username:'admin', password:'admin123'})
  });
  const d = await r.json();
  return d.token;
}

function log(msg) {
  const el = document.getElementById('log');
  const now = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
  el.innerHTML = `<div class="entry"><span class="time">${now}</span>${msg}</div>` + el.innerHTML;
}

function setStatus(type, text, cls) {
  const el = document.getElementById(`status-${type}`);
  el.textContent = text;
  el.className = `status ${cls}`;
}

async function solicitar(tipo) {
  const btn = document.getElementById(`btn-${tipo}`);
  btn.disabled = true;
  setStatus(tipo, 'Enviando...', 'loading');
  log(`Solicitando acta de ${tipo}...`);

  try {
    const token = await getToken();
    const endpoint = tipo === 'matrimonio'
      ? `${API}/api/consultaunica/actas/matrimonio`
      : `${API}/api/consultaunica/actas`;

    const body = tipo === 'matrimonio'
      ? {curp: CURP}
      : {curp: CURP, acta_type: tipo};

    const r = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
      body: JSON.stringify(body)
    });
    const d = await r.json();

    if (!d.ok) throw new Error(d.error || 'Error desconocido');

    setStatus(tipo, 'Pendiente', 'pending');
    log(`UUID: ${d.uuid} — ${d.message}`);
    JOBS[tipo] = {uuid: d.uuid, status: 'pending'};
    btn.disabled = false;

    // Poll status
    pollStatus(tipo, d.uuid);

  } catch(e) {
    setStatus(tipo, 'Error', 'error');
    log(`Error: ${e.message}`);
    btn.disabled = false;
  }
}

async function pollStatus(tipo, uuid) {
  const poll = async () => {
    try {
      const token = await getToken();
      const r = await fetch(`${API}/api/consultaunica/actas/status/${uuid}`, {
        headers: {'Authorization': `Bearer ${token}`}
      });
      const d = await r.json();

      if (d.status === 'completed') {
        setStatus(tipo, 'Completado', 'ok');
        log(`${tipo}: Acta encontrada ✓`);
        JOBS[tipo].status = 'completed';

        // Si matrimonio completó, habilitar divorcio
        if (tipo === 'matrimonio') {
          document.getElementById('btn-divorcio').classList.remove('hidden');
          document.getElementById('btn-divorcio').disabled = false;
          document.getElementById('status-divorcio').textContent = 'Solicitar';
          log('Acta de matrimonio encontrada — divorcio habilitado');
        }

        // Si nacimiento completó, descargar PDF
        if (tipo === 'nacimiento' && d.pdfBase64) {
          downloadPDF(d.pdfBase64, `acta_nacimiento_${CURP}.pdf`);
          log('PDF descargado');
        }

      } else if (d.status === 'failed') {
        setStatus(tipo, 'No encontrada', 'error');
        log(`${tipo}: ${d.errorMessage || 'No se encontró acta para esta CURP'}`);
        JOBS[tipo].status = 'failed';

      } else {
        // Pending, poll again in 5s
        setTimeout(poll, 5000);
      }
    } catch(e) {
      setTimeout(poll, 10000);
    }
  };
  setTimeout(poll, 3000);
}

function downloadPDF(b64, filename) {
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  const blob = new Blob([arr], {type: 'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
